name: glass_menu
description: "A customizable frosted glass (liquid glassmorphism) navigation bar for Flutter supporting wrap content, expandable animations, and custom positioning."
version: 1.1.0
homepage: https://github.com/unshami/glass_menu
repository: https://github.com/unshami/glass_menu
issue_tracker: https://github.com/unshami/glass_menu/issues
topics:
  - navigation
  - glassmorphism
  - menu
  - frosted-glass
  - ui

screenshots:
  - description: 'Mobile view of the liquid glass menu capsule and floating search button.'
    path: screenshots/glass_menu_mobile.png
  - description: 'Dark mode view of the liquid glass menu capsule with real-time blur.'
    path: screenshots/glass_menu_dark.png
  - description: 'Desktop view of the frosted liquid glass navigation bar in Flutter with wrapContent and animations.'
    path: screenshots/glass_menu_desktop.png

environment:
  sdk: ^3.11.4
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
